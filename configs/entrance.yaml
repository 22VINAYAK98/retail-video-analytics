# Entrance video configuration
# Coordinate system: original 1280x720 video frame.
#
# ROI semantics:
#   outside_store:
#       Public mall/corridor area.
#
#   inside_store_entering_area:
#       Store entrance / transition region.
#
#   inside_store:
#       Main store interior.
#
# Person ROI membership will later be determined using
# the bottom-center point of each tracked person's bounding box.

video:
  path: data/entrance.mp4
  width: 1280
  height: 720
  fps: 30.0

rois:
  outside_store:
