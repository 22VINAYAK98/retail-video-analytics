# Entrance video configuration
# Coordinate system: original 1280x720 video frame.
#
# ROI semantics:
#   outside_store:
#       Public mall/corridor area.
#
#   inside_store_entering_area:
#       Store entrance / transition region.
#
#   inside_store:
#       Main store interior.
#
# Person ROI membership will later be determined using
# the bottom-center point of each tracked person's bounding box.

video:
  path: data/entrance.mp4
  width: 1280
  height: 720
  fps: 30.0

rois:

  outside_store:
    polygon:
      - [350, 45]
      - [1214, 220]
      - [1117, 460]
      - [499, 279]
      - [380, 248]
      - [349, 48]

  inside_store_entering_area:
    polygon:
      - [1115, 458]
      - [1107, 500]
      - [1001, 468]
      - [719, 383]
      - [483, 303]
      - [362, 269]
      - [371, 249]

  inside_store:
    polygon:
      - [351, 98]
      - [0, 264]
      - [2, 717]
      - [1278, 718]
      - [1267, 325]
      - [1158, 523]
      - [1107, 508]
      - [362, 266]
      - [355, 96]